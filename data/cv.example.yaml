# =============================================================================
#  data/cv.example.yaml  |  starter file - copy it to data/cv.yaml and edit
# -----------------------------------------------------------------------------
#  Every field below is required unless marked optional, and this file passes
#  `python scripts/validate.py` as-is. Then:
#
#      python scripts/generate.py     # -> src/generated/*.tex + web/index.html
#      python scripts/validate.py     # -> must print ALL STATIC CHECKS PASSED
#
#  `data/cv.yaml` is gitignored on purpose: the repository keeps your content
#  encrypted (data/cv.yaml.age) instead - see README.md > "Keeping it private".
#
#  There is no `pdf_url`: the PDF is embedded in the page (scripts/embed_pdf.py)
#  and encrypted together with it, so it has no URL of its own - it can only be
#  downloaded from the page, after the code is typed in.
# =============================================================================
meta:
  name: Your Name
  role: Your Job Title
  location: City, Country
  phone: "+1 555 0100"
  phone_link: "+15550100"
  email: you@example.com
  linkedin_label: linkedin.com/in/you
  linkedin_url: https://www.linkedin.com/in/you/
  site_url: https://YOUR-USER.github.io/YOUR-REPO/
  page_title: Your Name — Your Job Title | Curriculum Vitae
  description: >-
    Curriculum Vitae of Your Name, Your Job Title. Download the PDF or view it
    online.
  pdf_title: Your Name - Curriculum Vitae
  pdf_keywords: Your Job Title, Skill One, Skill Two
  preview_image: preview.png
  pdf_download_name: Your_Name_CV.pdf
  noindex: false

theme:
  bar: "#2E5C8A"
  bar_text: "#FFFFFF"
  accent: "#1F4E79"
  muted: "#5A6472"
  rule: "#C9D6E4"
  head_bg: "#E4EBF4"
  tech_bg: "#F2F6FB"
  page_bg: "#EEF1F5"
  body: "#1A1A1A"

fonts:
  latex: sourceserifpro
  html: "Source Serif 4"
  html_fallback: Georgia, "Times New Roman", Times, serif

layout:
  margin_x_cm: 1.4
  margin_y_cm: 0.95
  max_width_px: 830
  web_base_font_px: 16

sections:
  summary:
    title: Profile Summary
    text: >-
      Two or three sentences: what you do, how long you have done it, your
      strongest technologies and the kind of team you are looking for.
  experience:
    title: Experience
    entries:
      - role: Your Job Title
        company: Company Name
        dates: 01/2024 – Present
        # optional: a few measurable achievements
        highlights:
          - Something measurable you achieved.
      - role: Previous Job Title
        company: Previous Company
        dates: 06/2020 – 12/2023
  skills:
    title: Skills
    groups:
      - name: Languages
        items: Java, TypeScript, SQL
        level: Advanced          # optional - level: "" hides the chip for this row
      - name: Cloud
        items: AWS, Azure
        level: Intermediate
  projects:
    title: Projects
    entries:
      - name: Project Name
        dates: 2024
        description: What the project does, in one or two sentences.
        responsibilities:
          - What you built or were responsible for.
        technologies: Java, Spring Boot, PostgreSQL
  education:
    title: Education
    entries:
      - school: University Name
        major: Your Major
        dates: 2018 – 2022
  languages:
    title: Language
    entries:
      - name: English
        score: "B2"
  certificates:
    title: Certificates
    entries:
      - name: Certificate Name
        issuer: Issuing Body
        issued: Jan 2025
        expires: Jan 2028
        credential_id: ABC123
