name: Build & Publish CVs

# The CV text is NOT in this repository: it lives in the PRIVATE repository
# anchu3003/cv-private, one `cv.yaml` per site. Every directory there that holds
# a `cv.yaml` becomes a page - there is no list to maintain here:
#
#   cv-private/<site>/cv.yaml  ->  https://anchu3003.github.io/cv/<site>/
#
# This workflow reads it with a deploy key (read-write: the built PDFs are
# written back into cv-history/ there, see below) and publishes one encrypted
# page per CV, plus the (password-protected) admin page at /admin/ and the
# chooser at the site root.
on:
  push:
    branches: [ main ]
  # cv-private/.github/workflows/dispatch-cv.yml sends this after a data change.
  repository_dispatch:
    types: [ cv-data ]
  # Safety net: rebuild even if the dispatch token is not configured.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read       # the PDFs go to the data repository, not to this one
  pages: write         # deploy GitHub Pages
  id-token: write      # OIDC for the Pages deployment

concurrency:
  # All CVs live in the same site, so a second run must never interleave.
  group: pages
  cancel-in-progress: true

env:
  DATA_REPO: anchu3003/cv-private

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read inside `if:`, so their presence is promoted.
      CV_PAGE_PROTECTED: ${{ secrets.CV_PDF_PASSWORD != '' }}
      CV_ADMIN_PROTECTED: ${{ secrets.CV_ADMIN_PASSWORD != '' }}
      CV_DATA_READY: ${{ secrets.CV_DATA_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout this repository (tooling)
        uses: actions/checkout@v4

      - name: Checkout the private CV sources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          # Deploy key scoped to cv-private (settings -> Deploy keys). It pushes
          # the PDF snapshots back, so it needs write access.
          ssh-key: ${{ secrets.CV_DATA_DEPLOY_KEY }}
          path: cv-data
          # Full history: the snapshot step compares a cv.yaml with the revision
          # the newest snapshot of that site was rendered from.
          fetch-depth: 0
          persist-credentials: false

      # Every <site>/cv.yaml in the data repository is a site. Adding a CV needs
      # no change here: drop the file in and the next build publishes it.
      - name: Discover the CV sites
        run: |
          set -euo pipefail
          sites=""
          for dir in cv-data/*/; do
            if [ -f "${dir}cv.yaml" ]; then
              sites="$sites $(basename "$dir")"
            fi
          done
          if [ -z "${sites// /}" ]; then
            echo "::error title=No CV source::No <site>/cv.yaml found in $DATA_REPO."
            exit 1
          fi
          echo "SITES=${sites# }" >> "$GITHUB_ENV"
          echo "sites:${sites}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build tools (PyYAML + cryptography)
        run: python -m pip install --quiet pyyaml cryptography

      - name: Refuse to build without the data repository key
        if: env.CV_DATA_READY != 'true'
        run: |
          echo "::error title=CV_DATA_DEPLOY_KEY is missing::The CV sources live in the private repository $DATA_REPO. Add a deploy key for it (write access, it pushes the PDF snapshots back) as the secret CV_DATA_DEPLOY_KEY."
          exit 1

      - name: Refuse to publish unprotected pages
        if: env.CV_PAGE_PROTECTED != 'true'
        run: |
          echo "::error title=CV_PDF_PASSWORD is missing::Both CV pages are published StatiCrypt-encrypted. Add the secret or the build refuses to publish."
          exit 1

      - name: Prepare one build directory per CV
        run: |
          set -euo pipefail
          for site in $SITES; do
            mkdir -p "build/$site" "build/$site/data"
            # A copy of the tooling (git archive: no .git, no untracked files).
            git archive HEAD | tar -x -C "build/$site"
            if [ ! -f "cv-data/$site/cv.yaml" ]; then
              echo "::error title=No CV source::cv-data/$site/cv.yaml is missing in $DATA_REPO."
              exit 1
            fi
            cp "cv-data/$site/cv.yaml" "build/$site/data/cv.yaml"
            ( cd "build/$site" && python3 scripts/generate.py )
            echo "rendered $site"
          done

      # ---- one XeLaTeX run per site --------------------------------------- #
      # A loop instead of one action step per CV, so a new site needs no edit
      # here. The image is the one `xu-cheng/latex-action@v4` pulls for
      # `os: debian`, so the PDF matches a local `make pdf` (Source Serif 4
      # ships with it and embeds; no extra_system_packages needed).
      - name: Compile every CV (XeLaTeX)
        env:
          TEX_IMAGE: ghcr.io/xu-cheng/texlive-debian:latest
        run: |
          set -euo pipefail
          docker pull --quiet "$TEX_IMAGE"
          for site in $SITES; do
            echo "== compiling $site =="
            ( cd "build/$site/src" &&
              docker run --rm -e HOME=/tmp --user "$(id -u):$(id -g)" \
                -v "$PWD/..:/work" -w /work/src "$TEX_IMAGE" \
                latexmk -xelatex -interaction=nonstopmode -halt-on-error cv.tex )
            grep -aoE 'Output written on cv\.(pdf|xdv) \([0-9]+ page' "build/$site/src/cv.log"
          done

      # ---- the built PDFs: recorded in the PRIVATE repository -------------- #
      # A PDF is not encrypted, so it can never sit next to the site: a static
      # host serves every file to anyone who asks. cv-history/ in the data
      # repository keeps the newest 20 per CV, and the admin page lists and
      # downloads them from there with the user's own token.
      #
      # One snapshot per site *that changed*: the PDF of an untouched CV is a
      # rebuild of the previous snapshot under a new commit name, so compare that
      # cv.yaml with the revision its newest snapshot came from. Changing both
      # yamls records both sites - the rule is per site, not per push.
      - name: Record the changed PDFs in cv-history/ (data repository)
        env:
          # The checkout above runs with persist-credentials: false, so the push
          # sets up the deploy key itself instead of relying on the git config.
          DEPLOY_KEY: ${{ secrets.CV_DATA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          version=$(git -C cv-data rev-parse --short HEAD)
          date=$(date -u +%F)
          recorded=0
          for site in $SITES; do
            prev=$(python3 scripts/history_cv.py latest --root cv-data/cv-history \
                     --site "$site")
            if [ -n "$prev" ] && git -C cv-data cat-file -e "${prev}^{commit}" 2>/dev/null \
               && git -C cv-data diff --quiet "$prev" HEAD -- "$site/cv.yaml"; then
              echo "skip $site: $site/cv.yaml is unchanged since $prev"
              continue
            fi
            pages=$(grep -aoE 'Output written on cv\.(pdf|xdv) \([0-9]+ page' "build/$site/src/cv.log" \
                    | grep -oE '[0-9]+' | head -1 || true)
            python3 scripts/history_cv.py add --root cv-data/cv-history \
              --site "$site" --pdf "build/$site/src/cv.pdf" \
              --version "$site@$version" --date "$date" --pages "${pages:-0}"
            recorded=$((recorded + 1))
          done
          if [ "$recorded" -eq 0 ]; then
            echo "no CV source changed - nothing to record"
            exit 0
          fi
          python3 scripts/history_cv.py prune --root cv-data/cv-history --keep 20
          cd cv-data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv-history
          if git diff --cached --quiet; then
            echo "cv-history/ is already up to date"
            exit 0
          fi
          # [skip dispatch]: never let a snapshot commit rebuild the site
          git commit -m "history: CV PDFs $(date -u +%Y-%m-%dT%H:%MZ) [skip dispatch]"
          install -m 600 /dev/stdin "$RUNNER_TEMP/cv-history-key" <<<"$DEPLOY_KEY"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/cv-history-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push "git@github.com:${DATA_REPO}.git" HEAD:main
          rm -f "$RUNNER_TEMP/cv-history-key"

      # ---- one page per CV, PDF embedded (no PDF file is ever published) -- #
      - name: Embed each PDF in its own page
        run: |
          set -euo pipefail
          for site in $SITES; do
            mkdir -p "$RUNNER_TEMP/clear/$site"
            python3 "build/$site/scripts/embed_pdf.py" \
              --in  "build/$site/web/index.html" \
              --pdf "build/$site/src/cv.pdf" \
              --out "$RUNNER_TEMP/clear/$site/index.html"
            cp "build/$site/web/style.css" "$RUNNER_TEMP/clear/$site/style.css"
          done

      - name: Encrypt both CV pages with the code (StatiCrypt)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.CV_PDF_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ${#STATICRYPT_PASSWORD} -lt 14 ]; then
            echo "::warning title=Short CV_PDF_PASSWORD::The code is shorter than 14 characters - consider using a longer one."
          fi
          rm -rf _site
          for site in $SITES; do
            mkdir -p "_site/$site"
            npx --yes staticrypt@3 "$RUNNER_TEMP/clear/$site/index.html" \
              -d "_site/$site" --config false --short
            cp "$RUNNER_TEMP/clear/$site/style.css" "_site/$site/style.css"
          done

      # ---- admin page: application log + CV snapshots --------------------- #
      - name: Render the admin page
        if: env.CV_ADMIN_PROTECTED == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clear/admin"
          python3 scripts/generate_admin.py \
            --out "$RUNNER_TEMP/clear/admin/index.html"

      - name: Encrypt the admin page with its own code (StatiCrypt)
        if: env.CV_ADMIN_PROTECTED == 'true'
        env:
          STATICRYPT_PASSWORD: ${{ secrets.CV_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ${#STATICRYPT_PASSWORD} -lt 14 ]; then
            echo "::warning title=Short CV_ADMIN_PASSWORD::Consider a longer admin password."
          fi
          mkdir -p _site/admin
          npx --yes staticrypt@3 "$RUNNER_TEMP/clear/admin/index.html" \
            -d "_site/admin" --config false --short

      - name: Warn when the admin page is not configured
        if: env.CV_ADMIN_PROTECTED != 'true'
        run: echo "::warning title=No admin page::Add the secret CV_ADMIN_PASSWORD to publish /admin/."

      - name: Add the chooser page at the site root
        run: |
          set -euo pipefail
          admin=()
          if [ -f _site/admin/index.html ]; then admin=(--admin-link admin/); fi
          python3 scripts/generate_chooser.py --data-dir cv-data \
            --out _site/index.html "${admin[@]}"

      # ---- the guard that keeps every CV out of the public site ----------- #
      - name: Verify nothing of any CV is published in the clear
        run: |
          set -euo pipefail
          data_args=()
          for site in $SITES; do
            python3 scripts/check_site.py "_site/$site" --data "cv-data/$site/cv.yaml"
            data_args+=(--data "cv-data/$site/cv.yaml")
          done
          if [ -f _site/admin/index.html ]; then
            python3 scripts/check_site.py _site/admin "${data_args[@]}"
          fi
          # The root is a chooser and /admin/ holds no CV text, but the scan still
          # proves no CV leaks anywhere below them.
          python3 scripts/check_site.py _site --allow-plain-index "${data_args[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
